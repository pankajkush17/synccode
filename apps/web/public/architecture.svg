<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
  <title>SyncCode architecture: browsers, sync nodes, Redis and Postgres</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8fae"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8a8fae" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)">
    <path d="M150 92V150"/>
    <path d="M490 92V150"/>
    <path d="M190 214L280 262"/>
    <path d="M450 214L360 262"/>
  </g>
  <g fill="none" stroke="#8a8fae" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M150 214V400H236"/>
    <path d="M490 214V400H404"/>
  </g>

  <g>
    <rect x="50" y="30" width="200" height="60" rx="14" fill="#8b7bff" fill-opacity=".16" stroke="#8b7bff" stroke-width="1.6"/>
    <text x="150" y="66" text-anchor="middle" fill="#8a8fae" font-weight="600">Mira's browser</text>
    <rect x="390" y="30" width="200" height="60" rx="14" fill="#ff7a90" fill-opacity=".16" stroke="#ff7a90" stroke-width="1.6"/>
    <text x="490" y="66" text-anchor="middle" fill="#8a8fae" font-weight="600">Jun's browser</text>
  </g>

  <g fill="#8a8fae" font-size="12.5">
    <text x="160" y="126">WebSocket</text>
    <text x="500" y="126">WebSocket</text>
    <text x="320" y="232" text-anchor="middle">publish / subscribe</text>
    <text x="160" y="330">batched writes</text>
    <text x="480" y="330" text-anchor="end">batched writes</text>
  </g>

  <g fill="#8a8fae" fill-opacity=".1" stroke="#8a8fae" stroke-width="1.6">
    <rect x="50" y="152" width="200" height="60" rx="14"/>
    <rect x="390" y="152" width="200" height="60" rx="14"/>
    <rect x="240" y="252" width="160" height="56" rx="14"/>
    <rect x="240" y="372" width="160" height="56" rx="14"/>
  </g>
  <g fill="#8a8fae" font-weight="600" text-anchor="middle">
    <text x="150" y="188">Sync node A</text>
    <text x="490" y="188">Sync node B</text>
    <text x="320" y="286">Redis</text>
    <text x="320" y="398">Postgres</text>
  </g>
  <text x="320" y="416" text-anchor="middle" fill="#8a8fae" font-size="12.5">snapshots + update log</text>
  <text x="320" y="482" text-anchor="middle" fill="#8a8fae" font-size="12.5">Any node can drop a room and any node can rebuild it.</text>
</svg>

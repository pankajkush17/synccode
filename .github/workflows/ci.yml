name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/synccode
  REDIS_URL: redis://localhost:6379
  EDIT_SECRET: 5ad1c0de5ad1c0de5ad1c0de5ad1c0de5ad1c0de5ad1c0de5ad1c0de5ad1c0de

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synccode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Unit + integration + two-node protocol tests, against the service containers above.
      - run: pnpm test
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_REDIS_URL: ${{ env.REDIS_URL }}

      - run: pnpm build

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synccode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @synccode/web exec playwright install --with-deps chromium

      - run: pnpm db:migrate
      - run: pnpm build

      - name: Start sync node and web
        run: |
          pnpm --filter @synccode/sync start > sync.log 2>&1 &
          pnpm --filter @synccode/web start > web.log 2>&1 &
          npx --yes wait-on --timeout 60000 http://localhost:4000/readyz http://localhost:3000
        env:
          PORT: 4000

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-debug
          path: |
            apps/web/playwright-report
            apps/web/test-results
            sync.log
            web.log

  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    # Production schema changes ship only from main, and only after everything is green.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: drizzle migrate
        # Skipped until the DATABASE_URL secret (Neon) is configured.
        if: env.PROD_DATABASE_URL != ''
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.PROD_DATABASE_URL }}

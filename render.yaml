services:
  - type: web
    name: synccode-sync
    runtime: node
    region: oregon
    plan: free
    # Node's bundled corepack can lag behind npm's signing-key rotation, so pnpm
    # is installed with its standalone script instead.
    buildCommand: >-
      sh -c 'export PNPM_HOME="$HOME/.local/share/pnpm";
      curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=12.21.0 sh -;
      export PATH="$PNPM_HOME:$PATH";
      pnpm install --frozen-lockfile && pnpm --filter @synccode/sync build'
    startCommand: node apps/sync/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase *transaction pooler* URI (port 6543). The direct host is IPv6-only, which Render cannot reach.
      - key: REDIS_URL
        sync: false # Upstash URL with the rediss:// (TLS) scheme
      - key: EDIT_SECRET
        sync: false # openssl rand -hex 32
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://synccode-seven.vercel.app
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      - key: RUN_MIGRATIONS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.2"

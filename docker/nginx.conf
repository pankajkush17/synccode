# L7 load balancer in front of two identical sync nodes.
#
# Default nginx balancing is round-robin, so consecutive connections alternate
# between sync-a and sync-b. Open the same room in two tabs and each tab's
# status bar will name a different node — yet both see the same document.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Docker's embedded DNS; re-resolve so a restarted container is picked up.
  resolver 127.0.0.11 valid=5s;

  upstream sync_nodes {
    server sync-a:4000 max_fails=2 fail_timeout=5s;
    server sync-b:4000 max_fails=2 fail_timeout=5s;
  }

  # "Connection: upgrade" only when the client asked to upgrade.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Edit tokens travel in the WebSocket query string: log the path, never the query.
  log_format sync '$remote_addr "$request_method $uri" $status upstream=$upstream_addr';
  access_log /dev/stdout sync;

  server {
    listen 80;

    location / {
      proxy_pass http://sync_nodes;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # WebSockets are long-lived; the client pings every 5s, so an hour of
      # silence really does mean the connection is dead.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # If a node is draining (readiness 503) or down, try the other one.
      proxy_next_upstream error timeout http_503;
    }
  }
}

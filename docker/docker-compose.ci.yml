# CI variant: the same backend topology without the web UI, with data kept in memory.
#
#   docker compose -f docker/docker-compose.ci.yml up --build --wait
#   SYNC_URLS=ws://localhost:4001,ws://localhost:4002 pnpm load-test

name: synccode-ci

x-sync: &sync
  build:
    context: ..
    dockerfile: apps/sync/Dockerfile
  environment: &sync-env
    DATABASE_URL: postgres://synccode:synccode@postgres:5432/synccode
    REDIS_URL: redis://redis:6379
    EDIT_SECRET: 5ad1c0de5ad1c0de5ad1c0de5ad1c0de5ad1c0de5ad1c0de5ad1c0de5ad1c0de
    PORT: "4000"
    LOG_LEVEL: warn
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synccode
      POSTGRES_PASSWORD: synccode
      POSTGRES_DB: synccode
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synccode -d synccode"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  sync-a:
    <<: *sync
    environment:
      <<: *sync-env
      NODE_NAME: sync-a
      RUN_MIGRATIONS: "true"
    ports:
      - "4001:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  sync-b:
    <<: *sync
    environment:
      <<: *sync-env
      NODE_NAME: sync-b
    ports:
      - "4002:4000"
    depends_on:
      sync-a: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      sync-a: { condition: service_healthy }
      sync-b: { condition: service_healthy }
